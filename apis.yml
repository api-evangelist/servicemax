aid: servicemax
name: ServiceMax
description: ServiceMax is asset-centric field service management (FSM) software that helps equipment
  manufacturers and service organizations maximize equipment uptime, optimize technician productivity,
  and streamline service delivery. Its cloud platform, built natively on the Salesforce platform (ServiceMax
  Core and Asset 360), spans work order and workflow management, scheduling and dispatch (Service Board),
  preventive and predictive maintenance, contract and entitlement management, parts and inventory, offline-capable
  mobile tools (ServiceMax Go), real-time technician collaboration (Zinc), and customer self-service (Engage).
  Founded in 2007 and acquired by PTC in 2023, ServiceMax integrates with PTC's IoT and PLM portfolio
  (ThingWorx, Windchill) and exposes its data and workflows through the underlying Salesforce API surface
  rather than a standalone public developer API.
